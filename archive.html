<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Archive | Jane Sternberger</title>
  <link rel="stylesheet" href="archive.css" />
</head>

<body>

  <div class="archive-controls">
    <button onclick="showTeacherView()">By Teacher</button>
    <button onclick="showTimelineView()">By Time</button>
  </div>

  <main id="archive"></main>

  <script>
    const artworks = [
      {
        src: "images/WhereHomeIs2026.jpg",
        teacher: "Julia",
        date: "2026-01"
      },
      {
        src: "images/ExtinguishedHope2025.jpeg",
        teacher: "Toropygin",
        date: "2025-11"
      },
      {
        src: "images/StillLifeStudy2025.jpeg",
        teacher: "Toropygin",
        date: "2025-10"
      },
      {
        src: "images/RoseStudy2026.jpeg",
        teacher: "Julia",
        date: "2026-03"
      },
      {
        src: "images/SunflowersStudy2025.jpeg",
        teacher: "Julia",
        date: "2025-09"
      },
      {
        src: "images/SunflowersStudy22025.jpg",
        teacher: "Toropygin",
        date: "2025-08"
      },
      {
        src: "images/PumpkinStudy2025.jpeg",
        teacher: "Julia",
        date: "2025-10"
      }
    ];

    const archive = document.getElementById("archive");

    function formatMonth(dateString) {
      const [year, month] = dateString.split("-");
      const date = new Date(year, month - 1);

      return date.toLocaleString("en-US", {
        month: "long",
        year: "numeric"
      });
    }

    function renderGrouped(groupKey) {
      archive.innerHTML = "";

      const groups = {};

      artworks.forEach(function(art) {
        const groupName = art[groupKey];

        if (!groups[groupName]) {
          groups[groupName] = [];
        }

        groups[groupName].push(art);
      });

      let groupNames = Object.keys(groups);

      if (groupKey === "date") {
        groupNames.sort().reverse();
      } else {
        groupNames.sort();
      }

      groupNames.forEach(function(groupName) {
        const section = document.createElement("section");
        section.className = "archive-section";

        const heading = document.createElement("h2");

        if (groupKey === "date") {
          heading.textContent = formatMonth(groupName);
        } else {
          heading.textContent = groupName;
        }

        section.appendChild(heading);

        const grid = document.createElement("div");
        grid.className = "archive-grid";

        groups[groupName].forEach(function(art) {
          const img = document.createElement("img");
          img.src = art.src;
          img.alt = "";
          grid.appendChild(img);
        });

        section.appendChild(grid);
        archive.appendChild(section);
      });
    }

    function showTeacherView() {
      renderGrouped("teacher");
    }

    function showTimelineView() {
      renderGrouped("date");
    }

    showTeacherView();
  </script>

</body>
</html>
