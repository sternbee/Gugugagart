    const archive = document.getElementById("archive");

    function formatMonth(dateString) {
      const [year, month] = dateString.split("-");
      const date = new Date(year, month - 1);

      return date.toLocaleString("en-US", {
        month: "long",
        year: "numeric"
      });
    }

    function renderGrouped(groupKey) {
      archive.innerHTML = "";

      const groups = {};

      artworks.forEach(function(art) {
        const groupName = art[groupKey];

        if (!groups[groupName]) {
          groups[groupName] = [];
        }

        groups[groupName].push(art);
      });

      let groupNames = Object.keys(groups);

      if (groupKey === "date") {
        groupNames.sort().reverse();
      } else {
        groupNames.sort(function(a, b) {
          if (a === "Yulia Chzhou") return -1;
          if (b === "Yulia Chzhou") return 1;
          return a.localeCompare(b);
        });
      }

      groupNames.forEach(function(groupName) {
        const section = document.createElement("section");
        section.className = "archive-section";

        const heading = document.createElement("h2");

        if (groupKey === "date") {
          heading.textContent = formatMonth(groupName);
        } else {
          heading.textContent = groupName;
        }

        section.appendChild(heading);

        const grid = document.createElement("div");
        grid.className = "archive-grid";

        groups[groupName].sort(function(a, b) {
          return b.date.localeCompare(a.date);
        });

        groups[groupName].forEach(function(art) {
          const img = document.createElement("img");
          img.src = art.src;
          img.alt = "";

          img.onclick = function() {
            openLightbox(art.src);
          };

          grid.appendChild(img);
        });

        section.appendChild(grid);
        archive.appendChild(section);
      });
    }

    function showTimelineView() {
      renderGrouped("date");
    }

    function showTeacherView() {
      renderGrouped("teacher");
    }

    function openLightbox(src) {
      document.getElementById("lightbox-image").src = src;
      document.getElementById("lightbox").classList.add("open");
    }

    function closeLightbox() {
      document.getElementById("lightbox").classList.remove("open");
      document.getElementById("lightbox-image").src = "";
    }

    showTimelineView();
