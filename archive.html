<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Archive | Jane Sternberger</title>
  <link rel="stylesheet" href="archive.css" />
</head>

<body>

  <div class="top-bar">
    <div class="archive-controls">
      <button onclick="showTimelineView()">By Time</button>
      <button onclick="showTeacherView()">By Teacher</button>
    </div>

    <a class="return-link" href="index.html">Main Page</a>
  </div>

  <main id="archive"></main>

  <div class="bottom-bar">
    <a class="return-link" href="index.html">Main Page</a>
  </div>

  <div id="lightbox" class="lightbox">
    <button class="close-button" onclick="closeLightbox()">×</button>
    <img id="lightbox-image" src="" alt="">
  </div>

  <script>
    const artworks = [
      {
        src: "images/WhereHomeIs2026.jpg",
        teacher: "Yulia Chzhou",
        date: "2026-04"
      },
      {
        src: "images/ExtinguishedHope2025.jpeg",
        teacher: "Yulia Chzhou",
        date: "2025-04"
      },
      {
        src: "images/StillLifeStudy2025.jpeg",
        teacher: "Yulia Chzhou",
        date: "2025-04"
      },
      {
        src: "images/RoseStudy2026.jpeg",
        teacher: "Yulia Chzhou",
        date: "2026-03"
      },
      {
        src: "images/SunflowersStudy2025.jpeg",
        teacher: "Yulia Chzhou",
        date: "2025-03"
      },
      {
        src: "images/SunflowersStudy22025.jpg",
        teacher: "Yulia Chzhou",
        date: "2025-03"
      },
      {
        src: "images/PumpkinStudy2025.jpeg",
        teacher: "Yulia Chzhou",
        date: "2025-02"
      },
      {
        src: "images/Xyo2_drapery.jpeg",
        teacher: "Oleg Toropygin",
        date: "2026-01"
      },
      {
        src: "images/Xyo2_draperywithpattern.jpg",
        teacher: "Oleg Toropygin",
        date: "2026-04"
      },
      {
        src: "images/Xyo2_copy.jpg",
        teacher: "Oleg Toropygin",
        date: "2026-04"
      }
    ];

    const archive = document.getElementById("archive");

    function formatMonth(dateString) {
      const [year, month] = dateString.split("-");
      const date = new Date(year, month - 1);

      return date.toLocaleString("en-US", {
        month: "long",
        year: "numeric"
      });
    }

    function renderGrouped(groupKey) {
      archive.innerHTML = "";

      const groups = {};

      artworks.forEach(function(art) {
        const groupName = art[groupKey];

        if (!groups[groupName]) {
          groups[groupName] = [];
        }

        groups[groupName].push(art);
      });

      let groupNames = Object.keys(groups);

      if (groupKey === "date") {
        groupNames.sort().reverse();
      } else {
        groupNames.sort(function(a, b) {
          if (a === "Yulia Chzhou") return -1;
          if (b === "Yulia Chzhou") return 1;
          return a.localeCompare(b);
        });
      }

      groupNames.forEach(function(groupName) {
        const section = document.createElement("section");
        section.className = "archive-section";

        const heading = document.createElement("h2");

        if (groupKey === "date") {
          heading.textContent = formatMonth(groupName);
        } else {
          heading.textContent = groupName;
        }

        section.appendChild(heading);

        const grid = document.createElement("div");
        grid.className = "archive-grid";

        groups[groupName].sort(function(a, b) {
          return b.date.localeCompare(a.date);
        });

        groups[groupName].forEach(function(art) {
          const img = document.createElement("img");
          img.src = art.src;
          img.alt = "";

          img.onclick = function() {
            openLightbox(art.src);
          };

          grid.appendChild(img);
        });

        section.appendChild(grid);
        archive.appendChild(section);
      });
    }

    function showTimelineView() {
      renderGrouped("date");
    }

    function showTeacherView() {
      renderGrouped("teacher");
    }

    function openLightbox(src) {
      document.getElementById("lightbox-image").src = src;
      document.getElementById("lightbox").classList.add("open");
    }

    function closeLightbox() {
      document.getElementById("lightbox").classList.remove("open");
      document.getElementById("lightbox-image").src = "";
    }

    showTimelineView();
  </script>

</body>
</html>
